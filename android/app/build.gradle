plugins {
    id "com.android.application"
}

def gowDebugSigningValues = [
    keystoreBase64: System.getenv("GOW_ANDROID_DEBUG_KEYSTORE_BASE64"),
    storePassword: System.getenv("GOW_ANDROID_DEBUG_KEYSTORE_PASSWORD"),
    keyAlias: System.getenv("GOW_ANDROID_DEBUG_KEY_ALIAS"),
    keyPassword: System.getenv("GOW_ANDROID_DEBUG_KEY_PASSWORD")
]
def gowDebugSigningProvided = gowDebugSigningValues.values().any {
    it != null && !it.trim().isEmpty()
}
def gowDebugSigningConfigured = gowDebugSigningValues.values().every {
    it != null && !it.trim().isEmpty()
}
if (gowDebugSigningProvided && !gowDebugSigningConfigured) {
    throw new GradleException(
        "Persistent Debug signing requires all four GOW_ANDROID_DEBUG_KEYSTORE_* secrets."
    )
}

def gowDebugKeystoreFile = file("$buildDir/forge-debug-signing.keystore")
if (gowDebugSigningConfigured) {
    try {
        if (!gowDebugKeystoreFile.parentFile.isDirectory()
                && !gowDebugKeystoreFile.parentFile.mkdirs()) {
            throw new IOException("Could not create the private signing directory.")
        }
        byte[] keystoreBytes = java.util.Base64.getDecoder().decode(
            gowDebugSigningValues.keystoreBase64
        )
        if (keystoreBytes.length < 1024) {
            throw new IOException("The persistent Debug keystore is unexpectedly small.")
        }
        gowDebugKeystoreFile.bytes = keystoreBytes
    } catch (Exception exception) {
        throw new GradleException(
            "Could not prepare the persistent Debug signing keystore.",
            exception
        )
    }
}
android {
    namespace "org.gowandroid.app"

    signingConfigs {
        if (gowDebugSigningConfigured) {
            persistentDebug {
                storeFile gowDebugKeystoreFile
                storePassword gowDebugSigningValues.storePassword
                keyAlias gowDebugSigningValues.keyAlias
                keyPassword gowDebugSigningValues.keyPassword
            }
        }
    }

    compileSdk 37
    buildToolsVersion "37.0.0"
    ndkVersion "30.0.16248370"

    defaultConfig {
        applicationId "org.gowandroid.app"
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName "0.1.0-dev"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20"
                arguments "-DANDROID_STL=c++_shared"
                targets "android-game"
            }
        }
    }

    buildFeatures {
        prefab true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            minifyEnabled false
            if (gowDebugSigningConfigured) {
                signingConfig signingConfigs.persistentDebug
            } else {
                project.logger.warn(
                    "FORGE Debug APK is using the ephemeral runner debug key. " +
                    "It cannot update an APK signed by another CI run."
                )
            }
            externalNativeBuild {
                cmake {
                    // Keep the experimental CPU GS rasterizer + Vulkan CRTC presenter in Debug.
                    // It supports textured batches, depth/alpha tests and GS blending, but still
                    // rejects fog/AA1 and has not passed reference-image or device validation.
                    arguments "-DGOW_ANDROID_ENABLE_GS_VULKAN=ON"
                }
            }
        }
        release {
            minifyEnabled false
            // Release signing must be configured by the maintainer.
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.8.0"
    implementation "androidx.core:core:1.19.1"
    implementation "androidx.games:games-activity:4.4.2"
}
