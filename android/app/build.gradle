plugins {
    id "com.android.application"
}

android {
    namespace "org.gowandroid.app"
    compileSdk 36
    ndkVersion "30.0.16248370"

    defaultConfig {
        applicationId "org.gowandroid.app"
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName "0.1.0-dev"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20"
                arguments "-DANDROID_STL=c++_shared"
                targets "android-game"
            }
        }
    }

    buildFeatures {
        prefab true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            minifyEnabled false
        }
        release {
            minifyEnabled false
            // Release signing must be configured by the maintainer.
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }
}

dependencies {
    implementation "androidx.games:games-activity:4.4.2"
}
