name: Android shell

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "port/kiexter/vu1/ps2_vu1_neon_compat.h"
      - "tools/build_recompiler_host.py"
      - "tools/check_android_runtime_lifecycle.py"
      - "tools/ps2_vfs_cdroot_smoke.cpp"
      - "tools/run_ps2_vfs_cdroot_smoke.py"
      - "tools/compare_gs_scene.py"
      - "tools/test_compare_gs_scene.py"
      - "android/app/src/main/cpp/cdroot_vfs.cpp"
      - "android/app/src/main/cpp/cdroot_vfs.h"
      - ".github/workflows/android-shell.yml"

permissions:
  contents: read

jobs:
  build-shell:
    name: Build Android arm64 shell
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Test battery interpretation on host JVM
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/battery-test"
          javac -Xlint:all -Werror -d "$RUNNER_TEMP/battery-test" \
            android/app/src/main/java/org/gowandroid/app/BatteryReading.java \
            android/app/src/test/java/org/gowandroid/app/BatteryReadingTest.java
          java -cp "$RUNNER_TEMP/battery-test" org.gowandroid.app.BatteryReadingTest

      - name: Locate Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 4 -type f -name sdkmanager -print -quit)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          echo "Using sdkmanager: $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmake/3.22.1/bin" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Vulkan shader compiler
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          glslangValidator --version

      - name: Install Android build packages
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;30.0.16248370" \
            "cmake;3.22.1"

          # Android 17's SDK package is published as android-37.0.
          # Keep a compatibility alias for build-tool versions that resolve
          # compileSdk 37 through the legacy android-37 directory name.
          if [ -d "$ANDROID_SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_SDK_ROOT/platforms/android-37"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare pinned Waffle runtime for Gradle/CMake
        run: |
          python tools/build_recompiler_host.py \
            --prepare-android-runtime \
            --work-dir "$RUNNER_TEMP/gowport-android-runtime" \
            --export-runtime-dir "$GITHUB_WORKSPACE/android/app/build/gow-runtime-source"

      - name: Check prepared Android PS2 runtime lifecycle contract
        shell: bash
        run: |
          python tools/check_android_runtime_lifecycle.py \
            --runtime-dir "$GITHUB_WORKSPACE/android/app/build/gow-runtime-source"

      - name: Test VU1 MXCSR/FPCR rounding-mode mapping
        shell: bash
        run: |
          c++ -std=c++20 -Wall -Wextra -Werror \
            android/app/src/test/cpp/vu1_fpcr_mapping_test.cpp \
            -Iport/kiexter/vu1 \
            -o "$RUNNER_TEMP/vu1-fpcr-mapping-test"
          "$RUNNER_TEMP/vu1-fpcr-mapping-test"

      - name: Test offline GS scene comparator
        shell: bash
        run: |
          python tools/test_compare_gs_scene.py

      - name: Test offline GS scene capture writer
        shell: bash
        run: |
          c++ -std=c++20 -Wall -Wextra -Werror \
            android/app/src/test/cpp/android_gs_scene_capture_test.cpp \
            android/app/src/main/cpp/android_gs_scene_capture.cpp \
            -Iandroid/app/src/main/cpp \
            -o "$RUNNER_TEMP/android-gs-scene-capture-test"
          "$RUNNER_TEMP/android-gs-scene-capture-test"

      - name: Test native Android input, disc readers and Waffle sector contract on host
        shell: bash
        run: |
          GOW_RUNTIME_DIR="$GITHUB_WORKSPACE/android/app/build/gow-runtime-source"

          c++ -std=c++20 -Wall -Wextra -Werror \
            android/app/src/test/cpp/dualshock2_packet_test.cpp \
            -Iandroid/app/src/main/cpp \
            -o "$RUNNER_TEMP/dualshock2-packet-test"
          "$RUNNER_TEMP/dualshock2-packet-test"

          c++ -std=c++20 -Wall -Wextra -Werror \
            android/app/src/test/cpp/iso9660_reader_test.cpp \
            android/app/src/main/cpp/iso9660_reader.cpp \
            android/app/src/main/cpp/iso9660_disc_layout.cpp \
            android/app/src/main/cpp/iso9660_installer.cpp \
            android/app/src/main/cpp/sha256.cpp \
            -Iandroid/app/src/main/cpp \
            -o "$RUNNER_TEMP/iso9660-reader-test"
          "$RUNNER_TEMP/iso9660-reader-test"

          c++ -std=c++20 -Wall -Wextra -Werror \
            android/app/src/test/cpp/iso9660_disc_layout_test.cpp \
            android/app/src/main/cpp/iso9660_reader.cpp \
            android/app/src/main/cpp/iso9660_disc_layout.cpp \
            android/app/src/main/cpp/iso9660_installer.cpp \
            android/app/src/main/cpp/sha256.cpp \
            "$GOW_RUNTIME_DIR/ps2xIOP/src/disc_source.cpp" \
            "$GOW_RUNTIME_DIR/ps2xIOP/src/ps2_path.cpp" \
            "$GOW_RUNTIME_DIR/ps2xIOP/src/emulator/imports/iop_cdvd.cpp" \
            "$GOW_RUNTIME_DIR/ps2xIOP/src/emulator/core/iop_memory.cpp" \
            "$GOW_RUNTIME_DIR/ps2xIOP/src/emulator/core/iop_kernel.cpp" \
            "$GOW_RUNTIME_DIR/ps2xIOP/src/emulator/core/sound_engine.cpp" \
            "$GOW_RUNTIME_DIR/ps2xIOP/src/emulator/core/memory_card.cpp" \
            -Wno-error=deprecated-declarations \
            -Iandroid/app/src/main/cpp \
            -I"$GOW_RUNTIME_DIR/ps2xIOP/include" \
            -I"$GOW_RUNTIME_DIR/ps2xIOP/src" \
            -o "$RUNNER_TEMP/iso9660-disc-layout-test"
          "$RUNNER_TEMP/iso9660-disc-layout-test"

          c++ -std=c++20 -Wall -Wextra -Werror \
            android/app/src/test/cpp/cdroot_vfs_test.cpp \
            android/app/src/main/cpp/cdroot_vfs.cpp \
            android/app/src/main/cpp/ps2_elf_validator.cpp \
            -Iandroid/app/src/main/cpp \
            -o "$RUNNER_TEMP/cdroot-vfs-test"
          "$RUNNER_TEMP/cdroot-vfs-test"

          c++ -std=c++20 -Wall -Wextra -Werror \
            android/app/src/test/cpp/private_boot_path_test.cpp \
            android/app/src/main/cpp/private_boot_path.cpp \
            -Iandroid/app/src/main/cpp \
            -o "$RUNNER_TEMP/private-boot-path-test"
          "$RUNNER_TEMP/private-boot-path-test"

          c++ -std=c++20 -Wall -Wextra -Werror \
            android/app/src/test/cpp/android_frame_scaler_test.cpp \
            android/app/src/main/cpp/android_frame_scaler.cpp \
            -Iandroid/app/src/main/cpp \
            -o "$RUNNER_TEMP/android-frame-scaler-test"
          "$RUNNER_TEMP/android-frame-scaler-test"

          c++ -std=c++20 -Wall -Wextra -Werror \
            android/app/src/test/cpp/android_gs_geometry_test.cpp \
            android/app/src/main/cpp/android_gs_geometry.cpp \
            -Iandroid/app/src/main/cpp \
            -I"$GOW_RUNTIME_DIR/ps2xRuntime/include" \
            -o "$RUNNER_TEMP/android-gs-geometry-test"
          "$RUNNER_TEMP/android-gs-geometry-test"

          c++ -std=c++20 -Wall -Wextra -Werror \
            android/app/src/test/cpp/android_gs_vulkan_backend_test.cpp \
            android/app/src/main/cpp/android_gs_vulkan_backend.cpp \
            android/app/src/main/cpp/android_gs_geometry.cpp \
            android/app/src/main/cpp/android_gs_cpu_rasterizer.cpp \
            "$GOW_RUNTIME_DIR/ps2xRuntime/src/lib/gs/gpu/gs_texture_store.cpp" \
            "$GOW_RUNTIME_DIR/ps2xRuntime/src/lib/gs/ps2_gs_memory.cpp" \
            -Iandroid/app/src/main/cpp \
            -I"$GOW_RUNTIME_DIR/ps2xRuntime/include" \
            -I"$GOW_RUNTIME_DIR/ps2xRuntime/src/lib" \
            -I"$GOW_RUNTIME_DIR/ps2xRuntime/src/lib/gs" \
            -I"$GOW_RUNTIME_DIR/ps2xRuntime/src/lib/gs/gpu" \
            -Wno-error=switch \
            -Wno-error=unused-parameter \
            -Wno-error=unused-variable \
            -o "$RUNNER_TEMP/android-gs-vram-adapter-test"
          "$RUNNER_TEMP/android-gs-vram-adapter-test"

      - name: Test PS2 VFS through the Android private cdRoot provider
        shell: bash
        run: |
          python tools/run_ps2_vfs_cdroot_smoke.py \
            --work-dir "$RUNNER_TEMP/gowport-android-runtime"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        id: build
        shell: bash
        working-directory: android
        env:
          GOW_ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.GOW_ANDROID_DEBUG_KEYSTORE_BASE64 }}
          GOW_ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.GOW_ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          GOW_ANDROID_DEBUG_KEY_ALIAS: ${{ secrets.GOW_ANDROID_DEBUG_KEY_ALIAS }}
          GOW_ANDROID_DEBUG_KEY_PASSWORD: ${{ secrets.GOW_ANDROID_DEBUG_KEY_PASSWORD }}
        run: |
          set +e
          gradle --no-daemon assembleDebug --stacktrace --info 2>&1 | tee "$RUNNER_TEMP/gow-android-build.log"
          BUILD_STATUS=${PIPESTATUS[0]}
          echo "exit_code=$BUILD_STATUS" >> "$GITHUB_OUTPUT"
          exit "$BUILD_STATUS"

      - name: Verify APK signature and print certificate
        if: steps.build.outputs.exit_code == '0'
        shell: bash
        env:
          GOW_ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.GOW_ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/gow-android-apk-signature.txt"
          CERT_SHA256="$(awk -F': ' '/certificate SHA-256 digest:/ { print $NF; exit }' "$RUNNER_TEMP/gow-android-apk-signature.txt")"
          if [[ ! "$CERT_SHA256" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::Could not parse a valid SHA-256 certificate fingerprint from apksigner output."
            cat "$RUNNER_TEMP/gow-android-apk-signature.txt"
            exit 1
          fi
          if [ -n "$GOW_ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            SIGNING_MODE="persistent GitHub Actions key"
          else
            SIGNING_MODE="ephemeral runner Debug key (not update-compatible)"
          fi
          {
            echo "### Android APK signing"
            echo "- Mode: $SIGNING_MODE"
            echo "- Certificate SHA-256: $CERT_SHA256"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gow-android-arm64-shell
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gow-android-build-log
          path: ${{ runner.temp }}/gow-android-build.log
          if-no-files-found: warn
          retention-days: 7
