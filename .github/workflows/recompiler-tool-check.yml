name: Host recompiler tool check

on:
  push:
    branches: [main]
    paths:
      - "tools/build_recompiler_host.py"
      - "tools/build_android_game.py"
      - "tools/inventory_iop_irx.py"
      - "tools/test_inventory_iop_irx.py"
      - "tools/build_android_native_aot.py"
      - "tools/test_android_native_aot.py"
      - "tools/test_android_game_build.py"
      - "tools/sync_android_aot_captures.py"
      - "tools/test_sync_android_aot_captures.py"
      - "tools/migrate_android_debug_installation.py"
      - "tools/test_migrate_android_debug_installation.py"
      - "tools/migrate_android_debug_installation.py"
      - "tools/test_migrate_android_debug_installation.py"
      - "tools/ps2_vfs_cdroot_smoke.cpp"
      - "tools/run_ps2_vfs_cdroot_smoke.py"
      - "tools/test_elf_validation.py"
      - "tools/ps2_vfs_cdroot_smoke.cpp"
      - "tools/run_ps2_vfs_cdroot_smoke.py"
      - "port/kiexter/tools/vu1n_gen.py"
      - "port/kiexter/vu1/ps2_vu1_neon_compat.h"
      - ".github/workflows/recompiler-tool-check.yml"
  pull_request:
    paths:
      - "tools/build_recompiler_host.py"
      - "tools/build_android_game.py"
      - "tools/inventory_iop_irx.py"
      - "tools/test_inventory_iop_irx.py"
      - "tools/test_android_game_build.py"
      - "tools/sync_android_aot_captures.py"
      - "tools/test_sync_android_aot_captures.py"
      - "tools/ps2_vfs_cdroot_smoke.cpp"
      - "tools/run_ps2_vfs_cdroot_smoke.py"
      - "tools/test_elf_validation.py"
      - "tools/ps2_vfs_cdroot_smoke.cpp"
      - "tools/run_ps2_vfs_cdroot_smoke.py"
      - "port/kiexter/tools/vu1n_gen.py"
      - "port/kiexter/vu1/ps2_vu1_neon_compat.h"
      - ".github/workflows/recompiler-tool-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Python entry point
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check syntax
        run: python -m py_compile tools/build_recompiler_host.py

      - name: Test PS2 ELF validation with synthetic fixtures
        run: |
          python -m py_compile tools/test_elf_validation.py
          python tools/test_elf_validation.py

      - name: Check CLI help
        run: python tools/build_recompiler_host.py --help

      - name: Test ISO-extracted IOP IRX inventory
        run: |
          python -m py_compile tools/inventory_iop_irx.py tools/test_inventory_iop_irx.py
          python tools/test_inventory_iop_irx.py

      - name: Test private Android AOT build orchestrator
        run: |
          python -m py_compile tools/build_android_game.py tools/test_android_game_build.py
          python tools/test_android_game_build.py
          python tools/build_android_game.py --help
          python tools/build_android_game.py \
            --installed-android \
            --plan-only \
            --work-dir "$RUNNER_TEMP/gowport-installed-plan"

      - name: Test automatic private Android AOT capture sync
        run: |
          python -m py_compile tools/sync_android_aot_captures.py tools/test_sync_android_aot_captures.py
          python tools/test_sync_android_aot_captures.py

      - name: Test verified Android Debug installation migration
        run: |
          python -m py_compile tools/migrate_android_debug_installation.py tools/test_migrate_android_debug_installation.py
          python tools/test_migrate_android_debug_installation.py
          python tools/migrate_android_debug_installation.py --help

      - name: Check VU1 generator syntax and strict coverage gate
        run: |
          python -m py_compile port/kiexter/tools/vu1n_gen.py
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          import tempfile

          root = Path(tempfile.mkdtemp(prefix="vu1-aot-gate-"))
          microcode = root / "microcode"
          output = root / "generated"
          microcode.mkdir()
          (microcode / "empty.bin").write_bytes(bytes(16 * 1024))
          result = subprocess.run(
              [
                  sys.executable,
                  "-I",
                  "port/kiexter/tools/vu1n_gen.py",
                  str(output),
                  str(microcode),
                  "--strict",
              ],
              capture_output=True,
              text=True,
          )
          if result.returncode != 2 or "STRICT AOT GENERATION FAILED" not in result.stderr:
              print(result.stdout)
              print(result.stderr, file=sys.stderr)
              raise SystemExit("VU1 strict gate did not reject an empty capture.")
          print("VU1 strict gate correctly rejected a capture with zero native blocks.")

          import struct
          callout_dir = root / "callout-microcode"
          callout_dir.mkdir()
          callout = bytearray(16 * 1024)
          struct.pack_into("<II", callout, 0, 0xFE000000, 0)
          (callout_dir / "interpreter-callout.bin").write_bytes(callout)
          callout_output = root / "callout-generated"
          callout_result = subprocess.run(
              [
                  sys.executable,
                  "-I",
                  "port/kiexter/tools/vu1n_gen.py",
                  str(callout_output),
                  str(callout_dir),
                  "--strict",
              ],
              capture_output=True,
              text=True,
          )
          if callout_result.returncode != 2 or "interpreter_callouts=1" not in callout_result.stderr:
              print(callout_result.stdout)
              print(callout_result.stderr, file=sys.stderr)
              raise SystemExit("VU1 strict gate accepted a block that calls the exact interpreter.")
          print("VU1 strict gate correctly rejected an AOT block with an exact-engine callout.")
          PY

      - name: Install desktop runtime build dependencies for strict VU1 compile check
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev libgl1-mesa-dev libglx-dev libopengl-dev libegl-dev libegl1-mesa-dev

      - name: Build pinned host recompiler without game files
        run: python tools/build_recompiler_host.py --build-only --work-dir /tmp/gowport

      - name: Test patched PS2 VFS against synthetic private cdRoot
        run: python tools/run_ps2_vfs_cdroot_smoke.py --work-dir /tmp/gowport
