name: Host recompiler tool check

on:
  push:
    branches: [main]
    paths:
      - "tools/build_recompiler_host.py"
      - ".github/workflows/recompiler-tool-check.yml"
  pull_request:
    paths:
      - "tools/build_recompiler_host.py"
      - ".github/workflows/recompiler-tool-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Python entry point
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check syntax
        run: python -m py_compile tools/build_recompiler_host.py

      - name: Check CLI help
        run: python tools/build_recompiler_host.py --help

      - name: Build pinned host recompiler without game files
        run: python tools/build_recompiler_host.py --build-only --work-dir /tmp/gowport
