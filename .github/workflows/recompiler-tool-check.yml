name: Host recompiler tool check

on:
  push:
    branches: [main]
    paths:
      - "tools/build_recompiler_host.py"
      - "port/kiexter/tools/vu1n_gen.py"
      - ".github/workflows/recompiler-tool-check.yml"
  pull_request:
    paths:
      - "tools/build_recompiler_host.py"
      - ".github/workflows/recompiler-tool-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Python entry point
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check syntax
        run: python -m py_compile tools/build_recompiler_host.py

      - name: Check CLI help
        run: python tools/build_recompiler_host.py --help

      - name: Check VU1 generator syntax and strict coverage gate
        run: |
          python -m py_compile port/kiexter/tools/vu1n_gen.py
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          import tempfile

          root = Path(tempfile.mkdtemp(prefix="vu1-aot-gate-"))
          microcode = root / "microcode"
          output = root / "generated"
          microcode.mkdir()
          (microcode / "empty.bin").write_bytes(bytes(16 * 1024))
          result = subprocess.run(
              [
                  sys.executable,
                  "-I",
                  "port/kiexter/tools/vu1n_gen.py",
                  str(output),
                  str(microcode),
                  "--strict",
              ],
              capture_output=True,
              text=True,
          )
          if result.returncode != 2 or "STRICT AOT COVERAGE FAILED" not in result.stderr:
              print(result.stdout)
              print(result.stderr, file=sys.stderr)
              raise SystemExit("VU1 strict gate did not reject an empty capture.")
          print("VU1 strict gate correctly rejected a capture with zero native blocks.")
          PY

      - name: Build pinned host recompiler without game files
        run: python tools/build_recompiler_host.py --build-only --work-dir /tmp/gowport
